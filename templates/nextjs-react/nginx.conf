# This config terminates plain HTTP only. session_token and csrf_token are
# both set with the Secure cookie attribute (see src/shared/lib/*), which
# browsers refuse to store over a connection that isn't HTTPS (localhost is
# exempt, so `pnpm dev` and CI are unaffected). Before this reaches real
# users, put TLS termination in front of it — a cloud load balancer/ingress,
# or a `listen 443 ssl` server block here with real certificates — otherwise
# login will return 200 but the session cookie will never be stored.
server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/css application/javascript application/json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Lets the app (and any TLS-terminating layer further upstream) know
        # the original scheme, since this block itself only speaks HTTP.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
